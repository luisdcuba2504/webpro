<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
    /* BWP-LANG v1 (2026-11-17): puerta de idioma de BuilderWeb Pro.
       Decide al instante, antes de que se pinte la página:
       1) la elección guardada del visitante (localStorage «bwp-lang»);
       2) si no hay, su idioma preferido: español -> /es/; inglés o
          cualquier otro -> /en/ (el inglés es el idioma por defecto).
       Sin JS no hay redirección: la página visible ofrece los dos
       botones y cada botón guarda la elección al pulsarlo. */
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem('bwp-lang'); } catch (e) {}
        var dest;
        if (saved === 'es' || saved === 'en') {
          dest = saved;
        } else {
          var pref = '';
          if (navigator.languages && navigator.languages.length) pref = navigator.languages[0];
          else if (navigator.language) pref = navigator.language;
          dest = (String(pref).toLowerCase().indexOf('es') === 0) ? 'es' : 'en';
        }
        location.replace('https://builderwebpro.com/' + dest + '/');
      } catch (e) {}
    })();
    </script>
<title>BuilderWeb Pro — Páginas Web para Negocios | Websites for Businesses</title>
