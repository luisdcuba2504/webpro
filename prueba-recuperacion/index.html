<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>PRUEBA RECUPERACION — página temporal</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<h1>PRUEBA RECUPERACION (página temporal del simulacro)</h1>
<form id="f">
<p><label>Nombre <input id="nombre" value="PRUEBA RECUPERACION"></label></p>
<p><label>Teléfono <input id="telefono" value="7135550120"></label></p>
<p><label>Correo <input id="correo" value="prueba.recuperacion@example.com"></label></p>
<p><label>Servicio <input id="servicio" value="Página web"></label></p>
<p><label>Mensaje <textarea id="mensaje">Prueba del simulacro de caída y recuperación automática. No es un cliente real.</textarea></label></p>
<div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>
<p><button type="submit">Enviar prueba</button></p>
</form>
<pre id="out"></pre>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const out = document.getElementById('out');
  const token = document.querySelector('input[name="cf-turnstile-response"]').value;
  const payload = {
    nombre: document.getElementById('nombre').value,
    name: document.getElementById('nombre').value,
    telefono: document.getElementById('telefono').value,
    phone: document.getElementById('telefono').value,
    correo: document.getElementById('correo').value,
    email: document.getElementById('correo').value,
    servicio: document.getElementById('servicio').value,
    service: document.getElementById('servicio').value,
    mensaje: document.getElementById('mensaje').value,
    message: document.getElementById('mensaje').value,
    form_type: 'rapido',
    submission_id: crypto.randomUUID(),
    'cf-turnstile-response': token
  };
  out.textContent = 'submission_id: ' + payload.submission_id + '\nEnviando…';
  try {
    const r = await fetch('https://builderwebpro-contacto-prueba.builderwebpro-tx-a50.workers.dev/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    out.textContent = 'submission_id: ' + payload.submission_id + '\nHTTP ' + r.status + '\n' + (await r.text());
  } catch (err) {
    out.textContent = 'submission_id: ' + payload.submission_id + '\nERROR: ' + err;
  }
});
</script>
</body>
</html>
